<div class="ecv" data-theme="__THEME__">
<style>
.ecv{--bg:#f6f7f9;--panel:#fff;--ink:#18202b;--muted:#5d6878;--line:#dfe3ea;--soft:#eef1f5;--accent:#0f6f8f;--up:#c2410c;--down:#15803d;
  --c0:#2f6fdb;--c1:#8b5cf6;--c2:#0e9f6e;--c3:#d9468f;--c4:#0891b2;--c5:#ca8a04;--c6:#4f46e5;--c7:#65a30d;
  --c-rest:#94a3b8;--c-sep0:#e07a1f;--c-sep1:#b45309;--c-g0:#cbd5e1;--c-g1:#f5c99a;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.45;
  background:var(--bg);color:var(--ink);padding:12px;display:grid;gap:12px;box-sizing:border-box}
@media (prefers-color-scheme:dark){.ecv[data-theme="auto"]{--bg:#11161d;--panel:#171e27;--ink:#e6ebf2;--muted:#98a3b3;--line:#2a3441;--soft:#1e2731;--accent:#4db3d4;--up:#fb923c;--down:#4ade80;
  --c0:#5b8ff0;--c1:#a78bfa;--c2:#34c38f;--c3:#ec6aa9;--c4:#22b8d6;--c5:#e5b021;--c6:#818cf8;--c7:#8bc34a;--c-rest:#64748b;--c-sep0:#f0913a;--c-sep1:#d97706;--c-g0:#475569;--c-g1:#8a5a2e;color-scheme:dark}}
.ecv[data-theme="dark"]{--bg:#11161d;--panel:#171e27;--ink:#e6ebf2;--muted:#98a3b3;--line:#2a3441;--soft:#1e2731;--accent:#4db3d4;--up:#fb923c;--down:#4ade80;
  --c0:#5b8ff0;--c1:#a78bfa;--c2:#34c38f;--c3:#ec6aa9;--c4:#22b8d6;--c5:#e5b021;--c6:#818cf8;--c7:#8bc34a;--c-rest:#64748b;--c-sep0:#f0913a;--c-sep1:#d97706;--c-g0:#475569;--c-g1:#8a5a2e;color-scheme:dark}
.ecv *{box-sizing:border-box}
.ecv header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.ecv h1{font-size:19px;margin:0;font-weight:650}
.ecv .nav{display:flex;align-items:center;gap:6px}
.ecv .plabel{min-width:170px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.ecv button{font:inherit;color:inherit;cursor:pointer}
.ecv .icon{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
.ecv .icon:disabled,.ecv .today:disabled{opacity:.35;cursor:default}
.ecv .today{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.ecv .bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.ecv .seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:2px}
.ecv .seg button{border:0;background:transparent;padding:6px 11px;border-radius:6px;color:var(--muted);font-weight:550}
.ecv .seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.ecv .check{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.ecv button:focus-visible,.ecv input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ecv .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.ecv .tiles{grid-template-columns:1fr}}
.ecv .tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:2px}
.ecv .tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ecv .tile .v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.ecv .tile .s{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ecv .up{color:var(--up)}.ecv .down{color:var(--down)}
.ecv .chart{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 10px 6px;position:relative;min-width:0}
.ecv .chart svg{width:100%;height:auto;display:block}
.ecv .chart text{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.ecv .grid{stroke:var(--line);stroke-width:1}
.ecv .prev{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 3;opacity:.6}
.ecv .hit{fill:transparent}.ecv .hit:hover{fill:var(--soft);opacity:.6}
.ecv .empty{padding:40px 12px;text-align:center;color:var(--muted)}
.ecv .tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgb(0 0 0 / .14);padding:8px 10px;font-size:12px;min-width:190px;display:grid;gap:2px}
.ecv .tip[hidden]{display:none}
.ecv .row{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.ecv .dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.ecv .legend{display:flex;flex-wrap:wrap;gap:6px}
.ecv .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:12px}
.ecv .chip[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.ecv .chip.fixed{cursor:default}
.ecv .pie{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:18px;align-items:center}
.ecv .pie .row{padding:5px 0;border-bottom:1px solid var(--line)}
@media (max-width:640px){.ecv .pie{grid-template-columns:1fr}}
.ecv .tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.ecv table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
.ecv th,.ecv td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ecv th:first-child,.ecv td:first-child{text-align:left}
.ecv th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--soft)}
.ecv tr.sum td{font-weight:650}.ecv tr.sub td{color:var(--muted)}
.ecv .foot{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:space-between}
</style>
<header>
  <h1 data-r="title"></h1>
  <div class="nav">
    <button class="icon" data-r="prev" aria-label="Zurück">&#9664;</button>
    <span class="plabel" data-r="plabel"></span>
    <button class="icon" data-r="next" aria-label="Weiter">&#9654;</button>
    <button class="today" data-r="today">Heute</button>
  </div>
</header>
<div class="bar">
  <div class="seg" data-s="period" role="group" aria-label="Zeitraum"><button data-v="day">Tag</button><button data-v="week">Woche</button><button data-v="month">Monat</button><button data-v="year">Jahr</button><button data-v="years">Jahre</button></div>
  <div class="seg" data-s="unit" role="group" aria-label="Einheit"><button data-v="kwh">kWh</button><button data-v="eur">Euro</button><button data-v="w">Ø Watt</button></div>
  <div class="seg" data-s="view" role="group" aria-label="Darstellung"><button data-v="bars">Verlauf</button><button data-v="pie">Anteile</button></div>
  <div class="seg" data-s="group" role="group" aria-label="Aufteilung" data-r="groupseg"><button data-v="cons">Verbraucher</button><button data-v="phase">Phasen</button></div>
  <label class="check"><input type="checkbox" data-r="prevyear"> Vorjahr</label>
</div>
<div class="tiles" data-r="tiles"></div>
<div class="chart" data-r="chart"></div>
<div class="legend" data-r="legend"></div>
<div class="tablewrap"><table data-r="table"></table></div>
<div class="foot"><span data-r="tariffs"></span><span data-r="stamp"></span></div>
<script>
(function () {
'use strict';
var D = __DATA__;
var root = document.currentScript.parentNode;
var $ = function (r) { return root.querySelector('[data-r="' + r + '"]'); };
var DAY = 864e5, H = 36e5;
var NOW = new Date(D.generated);

// ---------- Datum ----------
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseDay(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function dayNo(d) { return Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(D0.getFullYear(), D0.getMonth(), D0.getDate())) / DAY); }
function daysIn(y, m) { return new Date(y, m + 1, 0).getDate(); }
function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function mondayOf(d) { var x = startOfDay(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function kw(d) { var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())), n = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - n); return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / DAY + 1) / 7); }
var D0 = parseDay(D.day0), H0 = parseDay(D.hour0).getTime();
var FIRST = D0, TODAY = startOfDay(NOW);
var MON = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
var MONL = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

// ---------- Zähler und Posten ----------
var M = D.meters;                                   // {k, name, group, tariff}
var total = M.filter(function (m) { return m.group === 'total'; })[0] || null;
var cons = M.filter(function (m) { return m.group === 'consumer'; });
var phases = M.filter(function (m) { return m.group === 'phase'; });
var seps = M.filter(function (m) { return m.group === 'separate'; });
var TN = D.tariffNames;
cons.forEach(function (m, i) { m.color = '--c' + (i % 8); });
phases.forEach(function (m, i) { m.color = '--c' + (i % 8); });
seps.forEach(function (m, i) { m.color = '--c-sep' + (i % 2); });
if (total) total.color = '--c-rest';
var REST = total ? { k: 'rest', name: 'Rest ' + total.name, tariff: total.tariff, color: '--c-rest', derived: true } : null;
var kinds = Object.keys(TN).filter(function (t) { return M.some(function (m) { return m.tariff === t; }); });
var FIX = kinds.map(function (t, i) { return { k: 'g_' + t, name: 'Grundpreis ' + TN[t], fix: t, color: '--c-g' + (i % 2) }; });
if (!phases.length) $('groupseg').hidden = true;

// ---------- Tarife (gelten ab Datum, jüngster zuerst gesucht) ----------
var TAR = {};
Object.keys(D.tariffs).forEach(function (t) { TAR[t] = D.tariffs[t].slice().sort(function (a, b) { return a.from < b.from ? -1 : 1; }); });
function tariffAt(t, dayStr) {
  var list = TAR[t] || [], hit = null;
  for (var i = 0; i < list.length && list[i].from <= dayStr; i++) hit = list[i];
  return hit;
}

// ---------- Werte ----------
function dayWh(m, i) { var a = D.days[m.k]; return a && i >= 0 && i < a.length ? a[i] : null; }
function hourWh(m, t) { var a = D.hours[m.k], i = Math.round((t - H0) / H); return a && i >= 0 && i < a.length ? a[i] : null; }

// Ein Zeitabschnitt: kWh und Kosten je Posten, Grundpreise je Tarif
function fillBucket(b, byHour, cap) {
  var from = new Date(Math.max(b.from, FIRST)), to = new Date(Math.min(b.to, cap));
  b.kwh = {}; b.eur = {}; b.hours = Math.max(0, (to - from) / H); b.empty = to <= from; b.noHours = false; b.noTariff = false;
  M.concat(REST ? [REST] : [], FIX).forEach(function (p) { b.kwh[p.k] = 0; b.eur[p.k] = 0; });
  if (b.empty) return;
  var add = function (m, kwh, dayStr) {
    b.kwh[m.k] += kwh;
    var tr = m.tariff ? tariffAt(m.tariff, dayStr) : null;
    if (m.tariff && !tr) b.noTariff = true;
    if (tr) b.eur[m.k] += kwh * tr.ap / 100;
  };
  var addFix = function (dayStr, share) {
    FIX.forEach(function (f) { var tr = tariffAt(f.fix, dayStr); if (tr) b.eur[f.k] += tr.gp * share; else b.noTariff = true; });
  };
  if (byHour) {
    var ds = ymd(from), dim = daysIn(from.getFullYear(), from.getMonth()), any = false;
    M.forEach(function (m) { var v = hourWh(m, from.getTime()); if (v !== null) { any = true; add(m, v / 1000, ds); } });
    if (!any && from.getTime() < H0) b.noHours = true;   // vor dem Stundenfenster
    addFix(ds, b.hours / 24 / dim);
  } else {
    for (var t = startOfDay(from); t < to; t.setDate(t.getDate() + 1)) {
      var i = dayNo(t), s = ymd(t), dim2 = daysIn(t.getFullYear(), t.getMonth());
      M.forEach(function (m) { var v = dayWh(m, i); if (v !== null) add(m, v / 1000, s); });
      addFix(s, 1 / dim2);
    }
  }
  if (REST) {   // Rest = Gesamt − Verbraucher mit gleichem Tarif
    var known = cons.filter(function (c) { return c.tariff === REST.tariff; });
    b.kwh.rest = Math.max(0, b.kwh[total.k] - known.reduce(function (a, c) { return a + b.kwh[c.k]; }, 0));
    b.eur.rest = Math.max(0, b.eur[total.k] - known.reduce(function (a, c) { return a + b.eur[c.k]; }, 0));
  }
}

// ---------- Zeiträume ----------
var S = { period: 'month', unit: 'kwh', view: 'bars', group: 'cons', prev: false, ref: new Date(NOW), hidden: {} };
try { var saved = JSON.parse(localStorage.getItem('ecv-' + D.id) || '{}'); ['period','unit','view','group'].forEach(function (k) { if (saved[k]) S[k] = saved[k]; }); S.prev = !!saved.prev; } catch (e) {}
function remember() { try { localStorage.setItem('ecv-' + D.id, JSON.stringify({ period: S.period, unit: S.unit, view: S.view, group: S.group, prev: S.prev })); } catch (e) {} }

function buckets(ref, period, cap) {
  var out = [], y = ref.getFullYear(), m = ref.getMonth(), k, a, b;
  var add = function (label, from, to, long) { out.push({ label: label, long: long, from: from, to: to }); };
  if (period === 'day') {
    var d0 = startOfDay(ref);
    for (k = 0; k < 24; k++) { a = new Date(d0); a.setHours(k); b = new Date(d0); b.setHours(k + 1); if (b <= a) continue;
      add(String(k).padStart(2, '0'), a, b, String(k).padStart(2, '0') + ':00–' + String(k + 1).padStart(2, '0') + ':00'); }
  } else if (period === 'week') {
    var mo = mondayOf(ref);
    for (k = 0; k < 7; k++) { a = new Date(mo); a.setDate(mo.getDate() + k); b = new Date(a); b.setDate(a.getDate() + 1);
      add(['Mo','Di','Mi','Do','Fr','Sa','So'][k] + ' ' + a.getDate() + '.', a, b, a.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' })); }
  } else if (period === 'month') {
    for (k = 1; k <= daysIn(y, m); k++) add(String(k), new Date(y, m, k), new Date(y, m, k + 1), new Date(y, m, k).toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'long' }));
  } else if (period === 'year') {
    for (k = 0; k < 12; k++) add(MON[k], new Date(y, k, 1), new Date(y, k + 1, 1), MONL[k] + ' ' + y);
  } else {
    for (k = FIRST.getFullYear(); k <= NOW.getFullYear(); k++) add(String(k), new Date(k, 0, 1), new Date(k + 1, 0, 1), String(k));
  }
  out.forEach(function (bk) { fillBucket(bk, period === 'day', cap); });
  return out;
}
function dayBucket(ref, cap) {
  var a = startOfDay(ref), b = new Date(a); b.setDate(a.getDate() + 1);
  var bk = { label: '', long: '', from: a, to: b }; fillBucket(bk, false, cap); return [bk];
}
function shift(ref, period, dir) {
  var r = new Date(ref);
  if (period === 'day') r.setDate(r.getDate() + dir);
  else if (period === 'week') r.setDate(r.getDate() + 7 * dir);
  else if (period === 'month') { r.setDate(1); r.setMonth(r.getMonth() + dir); }
  else if (period === 'year') r.setFullYear(r.getFullYear() + dir);
  return r;
}
function back(d) { return S.period === 'day' ? shift(d, 'day', -364) : shift(d, 'year', -1); }
function periodRange(ref, p) {
  if (p === 'day') { var a = startOfDay(ref), b = new Date(a); b.setDate(a.getDate() + 1); return [a, b]; }
  if (p === 'week') { var m = mondayOf(ref), e = new Date(m); e.setDate(m.getDate() + 7); return [m, e]; }
  if (p === 'month') return [new Date(ref.getFullYear(), ref.getMonth(), 1), new Date(ref.getFullYear(), ref.getMonth() + 1, 1)];
  if (p === 'year') return [new Date(ref.getFullYear(), 0, 1), new Date(ref.getFullYear() + 1, 0, 1)];
  return [FIRST, new Date(NOW.getFullYear() + 1, 0, 1)];
}
function periodLabel(ref, p) {
  if (p === 'day') return ref.toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
  if (p === 'week') { var mo = mondayOf(ref), so = new Date(mo); so.setDate(mo.getDate() + 6); return 'KW ' + kw(mo) + ' · ' + mo.getDate() + '.' + (mo.getMonth() + 1) + '.–' + so.getDate() + '.' + (so.getMonth() + 1) + '.' + so.getFullYear(); }
  if (p === 'month') return MONL[ref.getMonth()] + ' ' + ref.getFullYear();
  if (p === 'year') return String(ref.getFullYear());
  return FIRST.getFullYear() + '–' + NOW.getFullYear();
}

// ---------- Posten der Ansicht ----------
function items() {
  var list = S.group === 'phase' ? phases.slice() : cons.concat(REST ? [REST] : []);
  list = list.concat(seps);
  if (!list.length && total) list = [total];
  return S.unit === 'eur' ? list.concat(FIX) : list;
}
function val(b, it) {
  if (b.empty) return 0;
  if (S.unit === 'eur') return b.eur[it.k] || 0;
  var k = b.kwh[it.k] || 0;
  return S.unit === 'w' ? (b.hours ? k * 1000 / b.hours : 0) : k;
}
function sumOf(bs, it, field) { return bs.reduce(function (a, b) { return a + (b[field][it.k] || 0); }, 0); }
function hoursOf(bs) { return bs.reduce(function (a, b) { return a + b.hours; }, 0); }
// Haushalt = Gesamtzähler, sonst Summe der Verbraucher; je eigenem Zähler (z. B. Wärmepumpe) eine Kachel
// Eine Kachelreihe je Tarif: Gesamtzähler des Tarifs, sonst Summe seiner Verbraucher/eigenen Zähler (ohne Phasen)
function groups() {
  var t = Object.keys(TN).filter(function (k) { return (TAR[k] || []).length || M.some(function (m) { return m.tariff === k; }); });
  return t.map(function (k) {
    var tot = M.filter(function (m) { return m.group === 'total' && m.tariff === k; });
    var parts = tot.length ? tot : M.filter(function (m) { return m.tariff === k && (m.group === 'consumer' || m.group === 'separate'); });
    return { name: TN[k], parts: parts, tariff: k };
  });
}

// ---------- Formatierung ----------
function fmt(v, u) {
  u = u || S.unit;
  if (u === 'eur') return v.toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
  if (u === 'w') return Math.round(v).toLocaleString('de-DE') + ' W';
  var d = v < 10 ? 2 : 1;
  return v.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d }) + ' kWh';
}
function axis(v) { return v.toLocaleString('de-DE', { maximumFractionDigits: v < 10 ? 2 : 0 }); }
function col(v) { return getComputedStyle(root).getPropertyValue(v).trim(); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function pct(cur, prv) { if (!prv) return '–'; var p = Math.round((cur / prv - 1) * 100); return p === 0 ? '±0 %' : '<span class="' + (p > 0 ? 'up' : 'down') + '">' + (p > 0 ? '+' : '−') + Math.abs(p) + ' %</span>'; }
function niceMax(v) { if (v <= 0) return 1; var p = Math.pow(10, Math.floor(Math.log10(v))), s = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]; for (var i = 0; i < s.length; i++) if (v <= s[i] * p) return s[i] * p; return 10 * p; }

// ---------- Darstellung ----------
function render() {
  root.querySelectorAll('[data-s]').forEach(function (seg) { var k = seg.dataset.s; seg.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === S[k])); }); });
  $('title').textContent = D.title;
  $('plabel').textContent = periodLabel(S.ref, S.period);
  var r = periodRange(S.ref, S.period);
  $('next').disabled = S.period === 'years' || r[1] > NOW;
  $('prev').disabled = S.period === 'years' || r[0] <= FIRST;
  $('today').disabled = S.period === 'years' || (r[0] <= NOW && NOW < r[1]);
  $('prevyear').disabled = S.period === 'years';
  $('prevyear').checked = S.prev;

  var bs = buckets(S.ref, S.period, NOW);
  var prevBs = S.prev && S.period !== 'years' ? buckets(back(S.ref), S.period, back(NOW)) : null;
  if (prevBs && S.period === 'day' && prevBs.some(function (b) { return b.noHours; })) prevBs = null;   // keine Stundenwerte fürs Vorjahr
  var its = items().filter(function (i) { return !S.hidden[i.k]; });
  // Tag außerhalb des Stundenfensters: Summen aus dem Tageswert
  var noHours = S.period === 'day' && bs.some(function (b) { return b.noHours; });
  var sums = noHours ? dayBucket(S.ref, NOW) : bs, prevSums = prevBs && noHours ? dayBucket(back(S.ref), back(NOW)) : prevBs;
  tiles(sums, prevSums, r);
  if (noHours) $('chart').innerHTML = '<div class="empty">Stundenwerte liegen nur für die letzten ' + D.hourDays + ' Tage vor. Die Summen stammen aus dem Tageswert.</div>';
  else if (S.view === 'pie') pie(bs, its); else bars(bs, prevBs, its);
  legend();
  table(sums, prevSums);
  var notes = kinds.map(function (t) { var tr = tariffAt(t, ymd(r[1] > NOW ? NOW : new Date(r[1] - 1))); return tr ? TN[t] + ': ' + tr.ap.toLocaleString('de-DE') + ' ct/kWh + ' + fmt(tr.gp, 'eur') + '/Monat (' + (tr.from <= '1970-01-01' ? 'seit Beginn' : 'ab ' + tr.from.split('-').reverse().join('.')) + ')' : TN[t] + ': kein Tarif'; });
  var missing = bs.some(function (b) { return b.noTariff; }) ? ' · Für einen Teil des Zeitraums ist kein Tarif hinterlegt.' : '';
  $('tariffs').textContent = notes.join(' · ') + missing;
  $('stamp').textContent = 'Stand ' + NOW.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  remember();
}

function tiles(bs, prevBs, r) {
  var h = hoursOf(bs), html = '';
  // laufender Zeitraum: Anteil der schon vergangenen Zeit für die Hochrechnung
  var f = 0, bis = { day: 'des Tages', week: 'der Woche', month: 'des Monats', year: 'des Jahres' }[S.period];
  if (bis && r[0] <= NOW && NOW < r[1]) f = (NOW - Math.max(r[0], FIRST)) / (r[1] - Math.max(r[0], FIRST));
  var proj = f > 0.02;
  var row = function (name, k, e, fix, pk, none) {
    if (none) return tile(name + ' · Verbrauch', '–', 'Kein Zähler berücksichtigt') + tile(name + ' · Kosten', '–', '') + tile(name + ' · Hochrechnung', '–', '');
    return tile(name + ' · Verbrauch', fmt(k, 'kwh'), [prevBs ? pct(k, pk) + ' zum Vorjahr' : '', h ? 'Ø ' + fmt(k * 1000 / h, 'w') : ''].filter(Boolean).join(' · '))
      + tile(name + ' · Kosten', fmt(e, 'eur'), 'inkl. Grundpreis ' + fmt(fix, 'eur'))
      + tile(name + ' · Hochrechnung', proj ? fmt(e / f, 'eur') : '–', proj ? fmt(k / f, 'kwh') + ' bis Ende ' + bis : 'nur für den laufenden Zeitraum');
  };
  var all = { k: 0, e: 0, fix: 0, pk: 0 }, gs = groups();
  gs.forEach(function (g) {
    var k = g.parts.reduce(function (a, p) { return a + sumOf(bs, p, 'kwh'); }, 0);
    var fx = FIX.filter(function (x) { return x.fix === g.tariff; }).reduce(function (a, x) { return a + sumOf(bs, x, 'eur'); }, 0);
    var e = g.parts.reduce(function (a, p) { return a + sumOf(bs, p, 'eur'); }, 0) + fx;
    var pk = prevBs ? g.parts.reduce(function (a, p) { return a + sumOf(prevBs, p, 'kwh'); }, 0) : 0;
    all.k += k; all.e += e; all.fix += fx; all.pk += pk;
    html += row(g.name, k, e, fx, pk, !g.parts.length);
  });
  if (gs.length > 1) html += row('Gesamt', all.k, all.e, all.fix, all.pk, false);
  $('tiles').innerHTML = html;
}
function tile(k, v, s) { return '<div class="tile"><span class="k">' + esc(k) + '</span><span class="v">' + v + '</span><span class="s">' + s + '</span></div>'; }

function bars(bs, prevBs, its) {
  var W = 1000, Hh = 360, L = 58, R = 12, TOP = 16, B = 34, pw = W - L - R, ph = Hh - TOP - B;
  var stacks = bs.map(function (b) { return its.map(function (i) { return val(b, i); }); });
  var tot = stacks.map(function (s) { return s.reduce(function (a, c) { return a + c; }, 0); });
  var prevTot = prevBs ? prevBs.map(function (b) { return its.reduce(function (a, i) { return a + val(b, i); }, 0); }) : null;
  if (!its.length || Math.max.apply(null, tot.concat(prevTot || [0])) <= 0) { $('chart').innerHTML = '<div class="empty">Kein Verbrauch im Zeitraum.</div>'; return; }
  var max = niceMax(Math.max.apply(null, tot.concat(prevTot || [0])));
  var y = function (v) { return TOP + ph - v / max * ph; };
  var gw = pw / bs.length, bw = Math.max(3, Math.min(46, gw * 0.66)), s = '<svg viewBox="0 0 ' + W + ' ' + Hh + '" role="img" aria-label="Verlauf">';
  for (var g = 0; g <= 4; g++) { var v = max * g / 4, yy = y(v); s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '"/><text x="' + (L - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + axis(v) + '</text>'; }
  s += '<text x="' + (L - 6) + '" y="10" text-anchor="end">' + { kwh: 'kWh', eur: '€', w: 'W' }[S.unit] + '</text>';
  var step = Math.ceil(bs.length / 16);
  bs.forEach(function (b, k) {
    var x = L + k * gw + (gw - bw) / 2, acc = 0;
    its.forEach(function (it, j) { var v = stacks[k][j]; if (v <= 0) return; s += '<rect x="' + x.toFixed(1) + '" y="' + y(acc + v).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + (y(acc) - y(acc + v)).toFixed(1) + '" style="fill:' + col(it.color) + '"/>'; acc += v; });
    if (k % step === 0 || k === bs.length - 1) s += '<text x="' + (L + k * gw + gw / 2).toFixed(1) + '" y="' + (Hh - 12) + '" text-anchor="middle">' + esc(b.label) + '</text>';
  });
  if (prevTot) s += '<polyline class="prev" points="' + prevTot.map(function (v, k) { return prevBs[k].empty ? '' : (L + k * gw + gw / 2).toFixed(1) + ',' + y(v).toFixed(1); }).filter(Boolean).join(' ') + '"/>';
  bs.forEach(function (b, k) { s += '<rect class="hit" data-k="' + k + '" x="' + (L + k * gw).toFixed(1) + '" y="' + TOP + '" width="' + gw.toFixed(1) + '" height="' + ph + '"/>'; });
  $('chart').innerHTML = s + '</svg><div class="tip" data-r="tip" hidden></div>';
  var tip = $('tip');
  var show = function (k, ev) {
    var b = bs[k]; if (b.empty) { tip.hidden = true; return; }
    var h = '<b>' + esc(b.long) + '</b>';
    its.forEach(function (it, j) { if (stacks[k][j] > 0) h += '<div class="row"><span><i class="dot" style="background:' + col(it.color) + '"></i>' + esc(it.name) + '</span><span>' + fmt(stacks[k][j]) + '</span></div>'; });
    h += '<div class="row"><b>Summe</b><b>' + fmt(tot[k]) + '</b></div>';
    if (prevTot) h += '<div class="row"><span>Vorjahr</span><span>' + fmt(prevTot[k]) + '</span></div>';
    tip.innerHTML = h; tip.hidden = false;
    var box = $('chart').getBoundingClientRect(), tw = tip.offsetWidth, left = ev.clientX - box.left + 14;
    if (left + tw > box.width - 4) left = ev.clientX - box.left - tw - 14;
    tip.style.left = Math.max(4, left) + 'px'; tip.style.top = Math.max(4, ev.clientY - box.top - 20) + 'px';
  };
  root.querySelectorAll('.hit').forEach(function (r) {
    r.addEventListener('mousemove', function (e) { show(+r.dataset.k, e); });
    r.addEventListener('mouseleave', function () { tip.hidden = true; });
    r.addEventListener('click', function (e) {   // Tippen: in den Abschnitt hineinzoomen
      var b = bs[+r.dataset.k], down = { years: 'year', year: 'month', month: 'day', week: 'day' }[S.period];
      if (b.empty) return;
      if (down) { S.period = down; S.ref = new Date(b.from); render(); } else show(+r.dataset.k, e);
    });
  });
}

function pie(bs, its) {
  var vals = its.map(function (it) { var v = bs.reduce(function (a, b) { return a + val(b, it); }, 0); if (S.unit === 'w') v = bs.length ? hoursOf(bs) && sumOf(bs, it, 'kwh') * 1000 / hoursOf(bs) : 0; return { v: v, it: it }; }).filter(function (x) { return x.v > 0; });
  var sum = vals.reduce(function (a, b) { return a + b.v; }, 0);
  if (sum <= 0) { $('chart').innerHTML = '<div class="empty">Kein Verbrauch im Zeitraum.</div>'; return; }
  var R = 120, r0 = 72, C = 150, a = -Math.PI / 2, s = '<svg viewBox="0 0 300 300" role="img" aria-label="Anteile">';
  var p = function (ang, rad) { return (C + rad * Math.cos(ang)).toFixed(2) + ',' + (C + rad * Math.sin(ang)).toFixed(2); };
  vals.forEach(function (x) {
    var da = x.v / sum * 2 * Math.PI, a2 = a + da, large = da > Math.PI ? 1 : 0;
    s += da >= 2 * Math.PI - 1e-6 ? '<circle cx="' + C + '" cy="' + C + '" r="' + (R + r0) / 2 + '" style="fill:none;stroke:' + col(x.it.color) + ';stroke-width:' + (R - r0) + '"/>'
      : '<path d="M' + p(a, R) + ' A' + R + ',' + R + ' 0 ' + large + ' 1 ' + p(a2, R) + ' L' + p(a2, r0) + ' A' + r0 + ',' + r0 + ' 0 ' + large + ' 0 ' + p(a, r0) + ' Z" style="fill:' + col(x.it.color) + '"><title>' + esc(x.it.name) + ': ' + fmt(x.v) + '</title></path>';
    a = a2;
  });
  s += '<text x="' + C + '" y="' + (C - 4) + '" text-anchor="middle" style="font-size:20px;font-weight:650;fill:var(--ink)">' + esc(fmt(sum)) + '</text><text x="' + C + '" y="' + (C + 16) + '" text-anchor="middle">' + (S.unit === 'w' ? 'Ø Leistung' : 'Summe') + '</text></svg>';
  var list = vals.sort(function (x, y) { return y.v - x.v; }).map(function (x) { return '<div class="row"><span><i class="dot" style="background:' + col(x.it.color) + '"></i>' + esc(x.it.name) + '</span><span>' + fmt(x.v) + ' · ' + (x.v / sum * 100).toFixed(1).replace('.', ',') + ' %</span></div>'; }).join('');
  $('chart').innerHTML = '<div class="pie"><div>' + s + '</div><div>' + list + '</div></div>';
}

function legend() {
  var html = items().map(function (i) { return '<button class="chip" data-k="' + i.k + '" aria-pressed="' + !S.hidden[i.k] + '"><i class="dot" style="background:' + col(i.color) + '"></i>' + esc(i.name) + '</button>'; }).join('');
  if (S.prev && S.period !== 'years' && S.view === 'bars') html += '<span class="chip fixed"><i class="dot" style="border:1.5px dashed var(--ink)"></i>Vorjahr (Summe)</span>';
  $('legend').innerHTML = html;
  $('legend').querySelectorAll('button').forEach(function (c) { c.addEventListener('click', function () { S.hidden[c.dataset.k] = !S.hidden[c.dataset.k]; render(); }); });
}

function table(bs, prevBs) {
  var h = hoursOf(bs), rows = items().filter(function (i) { return !i.fix; });
  var allK = rows.reduce(function (a, i) { return a + sumOf(bs, i, 'kwh'); }, 0), allE = 0;
  var t = '<thead><tr><th>Kreis</th><th>kWh</th><th>Anteil</th><th>Ø Leistung</th><th>Kosten</th>' + (prevBs ? '<th>Vorjahr</th>' : '') + '</tr></thead><tbody>';
  rows.forEach(function (i) {
    var k = sumOf(bs, i, 'kwh'), e = sumOf(bs, i, 'eur'); allE += e;
    t += '<tr><td><i class="dot" style="background:' + col(i.color) + '"></i>' + esc(i.name) + '</td><td>' + fmt(k, 'kwh') + '</td><td>' + (allK ? (k / allK * 100).toFixed(1).replace('.', ',') + ' %' : '–') + '</td><td>' + fmt(h ? k * 1000 / h : 0, 'w') + '</td><td>' + fmt(e, 'eur') + '</td>' + (prevBs ? '<td>' + pct(k, sumOf(prevBs, i, 'kwh')) + '</td>' : '') + '</tr>';
  });
  FIX.forEach(function (f) { var e = sumOf(bs, f, 'eur'); allE += e; t += '<tr class="sub"><td>' + esc(f.name) + '</td><td></td><td></td><td></td><td>' + fmt(e, 'eur') + '</td>' + (prevBs ? '<td></td>' : '') + '</tr>'; });
  t += '<tr class="sum"><td>Summe</td><td>' + fmt(allK, 'kwh') + '</td><td>100 %</td><td>' + fmt(h ? allK * 1000 / h : 0, 'w') + '</td><td>' + fmt(allE, 'eur') + '</td>' + (prevBs ? '<td></td>' : '') + '</tr></tbody>';
  $('table').innerHTML = t;
}

// ---------- Bedienung ----------
root.querySelectorAll('[data-s]').forEach(function (seg) {
  seg.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; S[seg.dataset.s] = b.dataset.v; if (seg.dataset.s !== 'period' && seg.dataset.s !== 'view') S.hidden = {}; render(); });
});
$('prev').addEventListener('click', function () { S.ref = shift(S.ref, S.period, -1); render(); });
$('next').addEventListener('click', function () { S.ref = shift(S.ref, S.period, 1); render(); });
$('today').addEventListener('click', function () { S.ref = new Date(NOW); render(); });
$('prevyear').addEventListener('change', function (e) { S.prev = e.target.checked; render(); });
root.ecv = { buckets: buckets, state: S, render: render };   // für Tests
render();
})();
</script>
</div>
